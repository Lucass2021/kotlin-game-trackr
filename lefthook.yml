pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.kt"
      run: ktlint --format {staged_files}
      stage_fixed: true
    lint:
      glob: "*.kt"
      run: ktlint {staged_files}
    file-length:
      glob: "*.kt"
      run: ./scripts/check-file-length.sh {staged_files}
    test:
      glob: "*.kt"
      run: ./scripts/test.sh
